<style>
:root{--bg:#f7f2e8;--cd:#fffdf8;--tx:#1d1810;--mu:#7d7463;--pri:#9a7420;--pri2:rgba(154,116,32,.12);--g1:#ecc968;--g2:#b8892b;--on:#1a1405;--bd:rgba(154,116,32,.24);--hd:rgba(247,242,232,.88);--gr:#4d7c0f;--wn:rgba(154,116,32,.12);--wt:#7a5a14;--shd:0 10px 28px rgba(90,64,10,.12);--hero:linear-gradient(135deg,#1f1a0e,#34290f);color-scheme:light;box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10}

.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border-color:transparent}
.hb{margin:10px 0}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:4px}
.tr{height:9px;border-radius:9px;background:var(--pri2);overflow:hidden}
.tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g2),var(--g1))}
svg.ch{width:100%;height:auto;stroke:none;display:block}

.ch .vt{fill:var(--tx);font-weight:700}
.ch .vb{fill:var(--pri)}
.ch .al{stroke:var(--tx);stroke-width:1;stroke-dasharray:3 3;opacity:.45}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:10px 0}
.ms div{font-size:.78rem;color:var(--mu)}

.ev:last-child{border:0}
.ev span{color:var(--mu);display:block;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
.logo.has{background:var(--cd);border:1px solid var(--bd);box-shadow:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.tag.w{background:var(--wn);color:var(--wt)}.tag.d{background:rgba(220,38,38,.12);color:#dc2626}
.c .v.r{color:#dc2626}
.tag.ok{background:rgba(77,124,15,.14);color:var(--gr)}
nav button{font-size:.6rem;letter-spacing:0}nav button svg{width:20px;height:20px}nav{padding:5px 3px}
.x svg{width:18px;height:18px;vertical-align:middle}
</style>

<body>
<header>
<div class="logo" id="lgo"><svg viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 6 0 2.5 2.5 0 0 0 5 0M9 20v-6h6v6"/></svg></div>

</div></div>

<div class="sh" id="sh2"><div id="sh2b"></div></div>
<script>
const I={
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
store:'<path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 6 0 2.5 2.5 0 0 0 5 0M9 20v-6h6v6"/>',
doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>',
menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const DY=['Minggu','Senin','Selasa','Rabu','Kamis','Jum’at','Sabtu'];
const MS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ML=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const rp=n=>Math.round(n).toLocaleString('id-ID');
const pad=n=>String(n).padStart(2,'0');
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>{const d=pd(s);return `${DY[d.getDay()]} ${d.getDate()} ${MS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`};
const short=n=>n.trim().split(/\s+/).pop();
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let S=null,REV=0,PIN=LS.g('rr77pin')||'',dirty=false,busy=false,stat='';
const isD=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d$/.test(s),nu=n=>typeof n==='number'&&isFinite(n);
const valid=d=>!!(d&&Array.isArray(d.outlets)&&d.outlets.length&&d.outlets.every(o=>o&&typeof o.name==='string'&&Array.isArray(o.items)&&o.items.every(i=>i&&isD(i.date)&&nu(i.qty)&&nu(i.price)&&typeof i.prod==='string'))&&(d.pay==null||Array.isArray(d.pay)&&d.pay.every(p=>p&&Number.isInteger(p.o)&&p.o>=0&&p.o<d.outlets.length&&nu(p.amt)&&isD(p.date)))&&(d.bahan==null||Array.isArray(d.bahan))&&(d.mov==null||Array.isArray(d.mov))&&(d.rek==null||Array.isArray(d.rek))&&(d.logo==null||/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(d.logo)));
const norm=()=>{S.pay=S.pay||[];S.pay.forEach(p=>{if(!p.id)p.id=uid()});S.bahan=S.bahan||[];S.mov=S.mov||[];S.rek=S.rek||[]};
const lsData=()=>{try{const d=JSON.parse(LS.g('rr77v2')||'null');return valid(d)?d:null}catch(e){return null}};
const cache=()=>{LS.s('rr77v2',JSON.stringify(S));LS.s('rr77rev',String(REV))};
const setStat=t=>{stat=t;const e=$('#st');if(e)e.textContent=t};
const save=()=>{cache();LS.s('rr77dirty','1');dirty=true;push()};
async function api(method,body){
  const r=await fetch('/api/data',{method,cache:'no-store',headers:{'content-type':'application/json',authorization:'Bearer '+PIN},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  return{r,j};
}
async function push(){
  if(busy||!dirty||!S)return;
  busy=true;dirty=false;setStat('Menyimpan…');
  try{
    const{r,j}=await api('PUT',{rev:REV,data:S});
    if(r.status===401){dirty=true;busy=false;PIN='';LS.d('rr77pin');lock('PIN salah atau sudah diganti');return}
    if(r.status===409&&j&&j.data){LS.s('rr77lost',JSON.stringify(S));S=j.data;norm();REV=j.rev;dirty=false;LS.d('rr77dirty');cache();msg='Data di server lebih baru (dari perangkat lain). Perubahan terakhir di perangkat ini tidak disimpan; salinannya ada di menu Lainnya.';busy=false;render();setStat('Dimuat ulang dari server');return}
    if(!r.ok||!j||!Number.isInteger(j.rev))throw new Error('gagal');
    REV=j.rev;LS.s('rr77rev',String(REV));busy=false;
    if(dirty)push();else{LS.d('rr77dirty');setStat('Tersimpan di server')}
  }catch(e){dirty=true;busy=false;setStat('Belum tersimpan. Akan dicoba lagi')}
}
function lock(m){S=null;$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Masuk</h1><p class="sub">Masukkan PIN untuk membuka data</p><div class="c"><label>PIN</label><input type="password" id="pin" autocomplete="current-password" autocapitalize="none">${m?`<p class="m" style="color:#dc2626">${esc(m)}</p>`:''}<button class="btn p" data-a="pin" style="margin-top:14px">Masuk</button></div>`}
function fail(m){S=null;$('#nav').innerHTML='';$('#app').innerHTML=`<h1>Tidak bisa memuat</h1><p class="sub">${esc(m)}</p><button class="btn p" data-a="retry">Coba lagi</button>`}
async function boot(){
  if(!PIN){lock();return}
  $('#nav').innerHTML='';$('#app').innerHTML='<p class="sub">Memuat data…</p>';
  let res=null;try{res=await api('GET')}catch(e){}
  if(res&&res.r.status===401){PIN='';LS.d('rr77pin');lock('PIN salah');return}
  if(res&&res.r.status===429){lock((res.j&&res.j.error)||'Terlalu banyak percobaan');return}
  const L=lsData(),lr=+LS.g('rr77rev')||0,ld=LS.g('rr77dirty')==='1';
  if(res&&res.r.ok&&res.j&&valid(res.j.data)){
    REV=res.j.rev;
    if(REV===0&&L){S=L;dirty=true;msg='Data lama di perangkat ini dipindahkan ke server'}
    else if(L&&ld&&lr===REV){S=L;dirty=true}
    else{
      S=res.j.data;dirty=false;
      if(L&&(ld||lr===0)&&JSON.stringify(L)!==JSON.stringify(S)){LS.s('rr77lost',JSON.stringify(L));msg='Ada data lain di perangkat ini. Salinannya ada di menu Lainnya.'}
    }
    norm();cache();render();push();
  }else if(L){
    S=L;REV=lr;dirty=ld;norm();render();setStat('Offline: memakai salinan di perangkat ini')
  }else fail((res&&res.j&&res.j.error)||'Tidak bisa terhubung ke server. Periksa internet.');
}
let tab='home',pre=0,msg='',per='bln';
const act=o=>o.items.filter(i=>!i.c);
const tot=o=>act(o).reduce((s,i)=>s+i.qty*i.price,0);
const sorted=o=>[...act(o)].sort((a,b)=>a.date.localeCompare(b.date));
const NAV=[['home','home','Beranda'],['out','store','Outlet'],['pay','cash','Bayar'],['bhn','box','Bahan'],['rep','doc','Laporan'],['more','menu','Lainnya']];

function home(){
  const now=new Date(),ym=iso(now).slice(0,7),td=iso(now),h=now.getHours();
  const hi=h<11?'pagi':h<15?'siang':h<18?'sore':'malam';
  const all=[];S.outlets.forEach((o,oi)=>o.items.forEach((i,ix)=>all.push({...i,o:o.name,oi,ix})));
  const mon=all.filter(i=>i.date.startsWith(ym)),t=mon.reduce((s,i)=>s+i.qty*i.price,0),por=mon.reduce((s,i)=>s+i.qty,0);
  const days=new Set(mon.map(i=>i.date)).size,tdI=all.filter(i=>i.date===td);
  const mx=all.reduce((a,i)=>!a||i.qty>a.qty?i:a,null);
  const PD=S.outlets.reduce((s,o,oi)=>s+paid(oi),0),OW=S.outlets.reduce((s,o,oi)=>s+Math.max(0,due(oi)),0),UN=S.outlets.filter((o,oi)=>due(oi)>0).length;
  const UNI=[];S.outlets.forEach((o,oi)=>{const A=alloc(oi);sorted(o).forEach(i=>{if(A.get(i)[0]!=='Lunas')UNI.push(i)})});
  const DUE=S.outlets.map(o=>{const a=act(o);if(!a.length)return null;const f=a.reduce((m,i)=>i.date<m?i.date:m,a[0].date);return{n:short(o.name),d:Math.floor((pd(td)-pd(f))/864e5)+1}}).filter(x=>x&&x.d>=7);
  const rec=[...all].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  else if(a==='s2save'){if(GS.m==='pay')saveP();else saveG()}
  else if(a==='emv'){const x=S.mov.find(y=>y.id===b.dataset.id);if(x)openG(x.t,x.b,x.id)}
  else if(a==='delmv'){if(!confirm('Hapus riwayat ini?'))return;S.mov=S.mov.filter(x=>x.id!==b.dataset.id);save();render()}
  else if(a==='delb'){if(!GS.w){GS.w=1;b.textContent='Yakin hapus?';return}S.bahan=S.bahan.filter(x=>x.id!==GS.id);S.mov=S.mov.filter(x=>x.b!==GS.id);save();$('#sh2').classList.remove('on');render()}
  else if(a==='copyb'){msg=(await cp(btext()))?'Rekap tersalin':'Gagal menyalin';render()}
  else if(a==='per'){per=b.dataset.p;render()}
  else if(a==='later'){S.backupAt=Date.now();save();render()}
  else if(a==='restore'){try{const d=JSON.parse($('#rs').value);if(!valid(d))throw 0;if(!confirm('Timpa semua data dengan cadangan ini?'))return;S=d;norm();save();msg='Data dipulihkan'}catch(x){msg='Teks cadangan tidak valid'}render()}
  else if(a==='reset'){if(confirm('Hapus semua data? Data di server ikut terhapus.')){S={outlets:[{name:'SJ TSM',items:[]}],pay:[],bahan:[],mov:[],rek:[]};save();render()}}
  else if(a==='tutup')closeP(+b.dataset.o);
  else if(a==='copyc'){const c=CL().find(x=>x.p.id===b.dataset.id);msg=c&&(await cp(ctext(c)))?'Rekap tersalin':'Gagal menyalin';render()}
  else if(a==='copyall'){msg=(await cp(CL().map(ctext).join('\n----------\n')))?'Semua rekap tersalin':'Gagal menyalin';render()}
  else if(a==='reopen'){const r=(S.rek||[]).find(x=>x.id===b.dataset.id);if(!r)return;if(!confirm('Buka lagi tagihan ini? Titipan dan pembayarannya digabung kembali ke tagihan berjalan outlet tersebut.'))return;S.outlets[r.o].items.forEach(i=>{if(i.c===r.id)delete i.c});S.pay.forEach(x=>{if(x.c===r.id)delete x.c});S.rek=S.rek.filter(x=>x.id!==r.id);save();msg='Tagihan dibuka lagi';render()}
  else if(a==='copyrek'){const r=(S.rek||[]).find(x=>x.id===b.dataset.id);msg=r&&(await cp(rtext(r)))?'Rekap tersalin':'Gagal menyalin';render()}
  else if(a==='pedit'){const x=S.pay.find(y=>y.id===b.dataset.id);if(x)openP(x.o,false,x.id)}
  else if(a==='addpay')openP(+b.dataset.o||0,b.dataset.f==='1');
  else if(a==='pdel'){if(!confirm('Hapus pembayaran ini? Sisa tagihan akan bertambah lagi.'))return;S.pay=S.pay.filter(x=>x.id!==b.dataset.id);save();msg='Pembayaran dihapus';render()}
  else if(a==='pin'){const v=$('#pin').value;if(!v)return;PIN=v;LS.s('rr77pin',v);boot()}
  else if(a==='retry')boot();
  else if(a==='logout'){if(!confirm('Keluar dan hapus salinan data di perangkat ini? Data di server tetap aman.'+(dirty?' PERHATIAN: ada perubahan yang belum tersimpan ke server!':'')))return;['rr77pin','rr77v2','rr77rev','rr77dirty','rr77lost'].forEach(k=>LS.d(k));PIN='';S=null;dirty=false;lock()}
  else if(a==='copylost'){msg=(await cp(LS.g('rr77lost')||''))?'Salinan tersalin':'Gagal menyalin';render()}
  else if(a==='droplost'){LS.d('rr77lost');render()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='lg')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const z=192,sc=Math.min(z/im.width,z/im.height,1),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');save();msg='Logo disimpan';render()};
    im.onerror=()=>{msg='File gambar tidak bisa dibaca';render()};im.src=r.result};r.readAsDataURL(f);
});
window.addEventListener('online',push);setInterval(push,20000);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin'){const b=$('[data-a=pin]');if(b)b.click()}});
boot();
</script>
